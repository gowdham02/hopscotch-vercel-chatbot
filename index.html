<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopscotch Support Bot</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 { margin-bottom: 6px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        #chat {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            height: 500px;
            overflow-y: auto;
        }
        .message {
            margin: 12px 0;
            padding: 12px 15px;
            border-radius: 12px;
            max-width: 80%;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .user {
            margin-left: auto;
            background: #e8f0fe;
        }
        .bot {
            margin-right: auto;
            background: #f0f0f0;
        }
        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        #message {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 14px 22px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #status { color: #777; margin-top: 10px; min-height: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Hopscotch Support Bot</h1>
    <div class="subtitle">Customer support assistant</div>

    <div id="chat"></div>

    <div class="input-row">
        <input id="message" type="text" placeholder="Type your message..." autocomplete="off">
        <button id="send" onclick="sendMessage()">Send</button>
    </div>

    <div id="status"></div>
</div>

<script>
let history = [];

const input = document.getElementById("message");
const sendButton = document.getElementById("send");
const status = document.getElementById("status");

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") sendMessage();
});

function addMessage(role, text) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "message " + role;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    addMessage("user", message);
    input.value = "";
    sendButton.disabled = true;
    status.textContent = "Thinking...";

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: message,
                history: history
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Request failed");
        }

        addMessage("bot", data.reply);

        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.reply });

        status.textContent = "";
    } catch (error) {
        addMessage("bot", "Sorry, something went wrong. Please try again.");
        status.textContent = error.message;
        console.error(error);
    } finally {
        sendButton.disabled = false;
        input.focus();
    }
}
</script>
</body>
</html>
